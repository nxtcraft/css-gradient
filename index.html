<body>
<nav>
  <span class="brand">🌈 CSS Gradient</span>
  <div class="nav-links"><a href="https://nxtcraft.github.io/">All Tools</a></div>
</nav>
<main>
  <h1>CSS Gradient Generator</h1>
  <p class="sub">Create linear, radial and conic CSS gradients with live preview. Copy code instantly.</p>
  <div class="layout">
    <div class="panel">
      <label>Type</label>
      <div class="type-tabs">
        <div class="type-tab active" onclick="setType('linear',this)">Linear</div>
        <div class="type-tab" onclick="setType('radial',this)">Radial</div>
        <div class="type-tab" onclick="setType('conic',this)">Conic</div>
      </div>
      <div id="angle-wrap">
        <label>Angle: <span id="angle-val">135</span>°</label>
        <input type="range" id="angle" min="0" max="360" value="135" oninput="update()">
      </div>
      <div id="radial-opts" style="display:none">
        <label>Shape</label>
        <select id="radial-shape" onchange="update()" style="width:100%;background:#0f0f1a;border:1.5px solid #2d2f52;color:#e2e8f0;border-radius:8px;padding:.4rem .6rem;font-size:.85rem;outline:none">
          <option value="ellipse">Ellipse</option>
          <option value="circle">Circle</option>
        </select>
        <label>Position</label>
        <select id="radial-pos" onchange="update()" style="width:100%;background:#0f0f1a;border:1.5px solid #2d2f52;color:#e2e8f0;border-radius:8px;padding:.4rem .6rem;font-size:.85rem;outline:none">
          <option value="center">Center</option>
          <option value="top left">Top Left</option>
          <option value="top right">Top Right</option>
          <option value="bottom center">Bottom Center</option>
        </select>
      </div>
      <label style="margin-top:.75rem">Color Stops</label>
      <div class="stops-wrap" id="stops-wrap"></div>
      <button class="btn-add" onclick="addStop()">+ Add Stop</button>
    </div>
    <div>
      <div class="preview-area" id="preview"><div class="preview-text">CSS Gradient Preview</div></div>
      <div class="code-box" id="code-box"></div>
      <button class="btn-copy" id="copy-btn" onclick="copyCSS()">📋 Copy CSS</button>
      <div class="presets" id="presets"></div>
    </div>
  </div>
</main>
<script>
let gType = 'linear';
let stops = [
  { color: '#a855f7', pos: 0 },
  { color: '#3b82f6', pos: 100 },
];

const PRESETS = [
  ['#a855f7','#ec4899'],['#6366f1','#a855f7'],['#0ea5e9','#22d3ee'],
  ['#10b981','#3b82f6'],['#f59e0b','#ef4444'],['#f97316','#fbbf24'],
  ['#ec4899','#f97316'],['#8b5cf6','#06b6d4'],['#14b8a6','#a3e635'],
  ['#e11d48','#7c3aed'],['#0f172a','#1e293b'],['#1e1b4b','#312e81'],
  ['#fdf2f8','#fff1f2'],['#f0fdf4','#ecfdf5'],['#fff7ed','#fef3c7'],
];

function renderStops() {
  const wrap = document.getElementById('stops-wrap');
  wrap.innerHTML = stops.map((s,i) => `
    <div class="stop-row">
      <input type="color" value="${s.color}" oninput="stops[${i}].color=this.value;update()">
      <input type="range" min="0" max="100" value="${s.pos}" oninput="stops[${i}].pos=+this.value;stops[${i}].posInput=${+this.value};syncPos(${i},this.value);update()">
      <input type="number" value="${s.pos}" min="0" max="100" oninput="stops[${i}].pos=+this.value;update()" style="width:52px">
      ${stops.length>2?`<button onclick="removeStop(${i})">✕</button>`:'<span style="width:22px"></span>'}
    </div>`).join('');
}

function syncPos(i, v) { stops[i].pos = +v; }

function addStop() {
  const mid = stops.length >= 2 ? Math.round((stops[stops.length-2].pos + stops[stops.length-1].pos)/2) : 50;
  stops.splice(stops.length-1, 0, { color:'#ffffff', pos: mid });
  renderStops(); update();
}

function removeStop(i) { stops.splice(i,1); renderStops(); update(); }

function setType(t, el) {
  gType = t;
  document.querySelectorAll('.type-tab').forEach(x=>x.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('angle-wrap').style.display = t==='linear'?'':'none';
  document.getElementById('radial-opts').style.display = t==='radial'?'':'none';
  update();
}

function buildGradient() {
  const sorted = [...stops].sort((a,b)=>a.pos-b.pos);
  const stopStr = sorted.map(s=>`${s.color} ${s.pos}%`).join(', ');
  if (gType==='linear') {
    const angle = document.getElementById('angle').value;
    return `linear-gradient(${angle}deg, ${stopStr})`;
  } else if (gType==='radial') {
    const shape = document.getElementById('radial-shape').value;
    const pos = document.getElementById('radial-pos').value;
    return `radial-gradient(${shape} at ${pos}, ${stopStr})`;
  } else {
    const angle = document.getElementById('angle').value;
    return `conic-gradient(from ${angle}deg, ${stopStr})`;
  }
}

function update() {
  const a = document.getElementById('angle');
  if (a) document.getElementById('angle-val').textContent = a.value;
  const grad = buildGradient();
  document.getElementById('preview').style.background = grad;
  document.getElementById('code-box').textContent = `background: ${grad};`;
}

function copyCSS() {
  const code = document.getElementById('code-box').textContent;
  navigator.clipboard.writeText(code).then(()=>{
    const btn = document.getElementById('copy-btn');
    btn.textContent = '✓ Copied!'; btn.classList.add('copied');
    setTimeout(()=>{ btn.textContent='📋 Copy CSS'; btn.classList.remove('copied'); },2000);
  });
}

function buildPresets() {
  const wrap = document.getElementById('presets');
  wrap.innerHTML = PRESETS.map((p,i)=>`<div class="preset" style="background:linear-gradient(135deg,${p[0]},${p[1]})" title="${p[0]} → ${p[1]}" onclick="applyPreset(${i})"></div>`).join('');
}

function applyPreset(i) {
  const p = PRESETS[i];
  stops = [{ color:p[0], pos:0 }, { color:p[1], pos:100 }];
  renderStops(); update();
}

renderStops(); buildPresets(); update();
</script>
